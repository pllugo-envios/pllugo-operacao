name: Publish Operação Pllugo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recover timed-out Pages deployment
        uses: actions/github-script@v8
        with:
          script: |
            // This exact deployment outlived the failed runner and blocked Pages.
            const target = 'a74bff993c7047a9ec7efc675c3992e0d5af3a20';
            const args = { ...context.repo, pages_deployment_id: target };
            try {
              const response = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', args);
              const pending = ['deployment_queued', 'deployment_in_progress', 'queued', 'in_progress', 'waiting'];
              if (pending.includes(response.data.status)) {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', args);
                for (let i = 0; i < 15; i++) {
                  await new Promise(resolve => setTimeout(resolve, 2000));
                  const current = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', args);
                  if (!pending.includes(current.data.status)) break;
                }
              }
            } catch (error) {
              if (error.status !== 404) core.setFailed('Não foi possível liberar a publicação anterior: HTTP ' + error.status);
            }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
